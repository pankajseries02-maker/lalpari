<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Lifestyle & Wealth Community</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .text-gold {
            color: #D4AF37;
        }
        .bg-gold {
            background-color: #D4AF37;
        }
        .border-gold {
            border-color: #D4AF37;
        }
        /* Subtle glow for background */
        .glow {
            box-shadow: 0 0 100px rgba(212, 175, 55, 0.1);
        }
    </style>
</head>
<body class="bg-black text-white antialiased h-screen flex flex-col items-center justify-center relative overflow-hidden">

    <!-- Abstract Luxury Background (No people, 100% Ad Safe) -->
    <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-gold opacity-5 rounded-full blur-3xl glow"></div>
    
    <!-- Dark Gradient Overlay -->
    <div class="absolute inset-0 bg-gradient-to-b from-black via-black/90 to-black"></div>

    <!-- Main Content -->
    <div class="relative z-10 text-center px-6 max-w-3xl mx-auto">
        
        <!-- Brand Name (Cleaned) -->
        <h2 class="text-sm md:text-base font-serif font-bold tracking-[0.4em] text-gold mb-8 uppercase">The Elite Circle</h2>
        
        
        <!-- Subtext (Value driven, not adult focused) -->
        <p class="text-gray-400 text-base md:text-lg font-light mb-10 max-w-xl mx-auto">
            Join an exclusive community
        </p>

        <!-- Telegram Button -->
        <a href="https://t.me/your_channel_link" target="_blank" class="inline-flex items-center justify-center gap-3 bg-gold text-black px-10 py-4 text-sm uppercase tracking-widest font-bold hover:bg-white transition duration-300 rounded-sm shadow-lg shadow-gold/20">
            <!-- Telegram SVG Icon -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M21.9439 4.51771C21.8403 4.10805 21.6222 3.74031 21.3181 3.46054C21.014 3.18078 20.6339 2.99928 20.2239 2.93554C19.0639 2.73554 4.06393 2.23554 3.06393 6.33554C2.76393 7.63554 3.06393 9.03554 4.06393 10.1355L8.06393 14.1355L6.06393 20.1355C5.96393 20.4355 6.06393 20.8355 6.26393 21.0355C6.46393 21.2355 6.76393 21.3355 7.06393 21.2355L14.0639 17.2355L18.0639 21.2355C18.4639 21.6355 18.9639 21.8355 19.4639 21.8355C19.6639 21.8355 19.8639 21.8355 20.0639 21.7355C20.7639 21.5355 21.2639 21.0355 21.4639 20.3355C22.2639 15.3355 22.2639 9.33554 21.9439 4.51771Z"/>
            </svg>
            Join Telegram Community
        </a>

        <!-- Footer note (Trust building, no age restriction mentioned) -->
        <p class="text-gray-600 text-xs mt-10 uppercase tracking-widest">
            Invite Only · Premium Network
        </p>

    </div>

</body>
</html>
